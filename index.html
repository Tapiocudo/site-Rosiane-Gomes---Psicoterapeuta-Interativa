<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro de Usuários</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="scripts.js" defer></script>
  </head>
  <body>
    <main class="app">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Fetch API + Web Storage API</p>
        <h1 id="page-title">Cadastro de usuários</h1>
        <p>
          Digite o CEP para preencher o endereço automaticamente. Os dados ficam
          salvos no navegador e voltam ao recarregar a página.
        </p>
      </section>

      <form class="form-card" id="userForm" autocomplete="on">
        <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>

        <fieldset>
          <legend>Dados pessoais</legend>

          <div class="field-group">
            <label for="name">Nome completo</label>
            <input id="name" name="name" type="text" placeholder="Ex.: Ana Souza" required />
          </div>

          <div class="field-row">
            <div class="field-group">
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" placeholder="ana@email.com" required />
            </div>

            <div class="field-group">
              <label for="phone">Telefone</label>
              <input id="phone" name="phone" type="tel" placeholder="(11) 99999-9999" />
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>

          <div class="field-row cep-row">
            <div class="field-group">
              <label for="cep">CEP</label>
              <input
                id="cep"
                name="cep"
                type="text"
                inputmode="numeric"
                maxlength="9"
                placeholder="00000-000"
                required
              />
            </div>

            <div class="field-group">
              <label for="state">UF</label>
              <input id="state" name="state" type="text" maxlength="2" placeholder="SP" />
            </div>
          </div>

          <div class="field-group">
            <label for="street">Logradouro</label>
            <input id="street" name="street" type="text" placeholder="Rua, avenida, travessa..." />
          </div>

          <div class="field-row">
            <div class="field-group">
              <label for="number">Número</label>
              <input id="number" name="number" type="text" placeholder="123" />
            </div>

            <div class="field-group">
              <label for="complement">Complemento</label>
              <input id="complement" name="complement" type="text" placeholder="Apto, bloco..." />
            </div>
          </div>

          <div class="field-row">
            <div class="field-group">
              <label for="neighborhood">Bairro</label>
              <input id="neighborhood" name="neighborhood" type="text" placeholder="Centro" />
            </div>

            <div class="field-group">
              <label for="city">Cidade</label>
              <input id="city" name="city" type="text" placeholder="São Paulo" />
            </div>
          </div>
        </fieldset>

        <div class="actions">
          <button class="button primary" type="submit">Salvar cadastro</button>
          <button class="button secondary" type="button" id="clearForm">Limpar dados</button>
        </div>
      </form>
    </main>
  </body>
</html>
